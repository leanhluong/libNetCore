name: Release

# Chỉ chạy khi đẩy một tag dạng v0.2.0.
# Phát hành gắn với TAG chứ không gắn với nhánh: mỗi phiên bản đã phát hành
# luôn trỏ về đúng một điểm cố định trong lịch sử, không bao giờ trôi.
on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write # cần quyền này mới đẩy được lên GitHub Packages

    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Chặn sai sót kinh điển: tag v0.2.0 nhưng quên sửa <Version> trong
      # Directory.Build.props, thế là phát hành ra gói 0.1.0 mang tên 0.2.0.
      - name: Đối chiếu tag với số phiên bản trong mã nguồn
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          # Neo đầu dòng: nếu không, biểu thức này bắt trúng cả chữ <Version>
          # nằm trong phần chú thích ngay phía trên và so nhầm với một chuỗi vô nghĩa.
          FILE_VERSION=$(grep -oP '^\s*<Version>\K[^<]+' Directory.Build.props | head -1)
          echo "Tag: $TAG_VERSION | Directory.Build.props: $FILE_VERSION"
          if [ "$TAG_VERSION" != "$FILE_VERSION" ]; then
            echo "::error::Tag ($TAG_VERSION) không khớp <Version> trong Directory.Build.props ($FILE_VERSION)."
            exit 1
          fi

      - name: Build
        run: dotnet build -c Release

      # Không phát hành thứ chưa qua test. Đây là lý do bước này không được bỏ
      # cho nhanh, dù CI đã chạy trên commit đó rồi.
      - name: Test
        run: dotnet test --no-build -c Release

      - name: Đóng gói
        run: dotnet pack --no-build -c Release -o nupkg

      - name: Đẩy lên GitHub Packages
        run: |
          dotnet nuget push "nupkg/*.nupkg" \
            --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --api-key "${{ secrets.GITHUB_TOKEN }}" \
            --skip-duplicate

      # Đẩy tiếp lên nuget.org. Bỏ qua êm nếu chưa cấu hình secret, để việc phát
      # hành nội bộ không bị chặn chỉ vì chưa kịp tạo API key.
      #
      # ⚠️ Khác GitHub Packages ở một điểm KHÔNG thể sửa: phiên bản đã lên nuget.org
      # thì KHÔNG BAO GIỜ xoá được, chỉ ẩn khỏi tìm kiếm (unlist). Ai biết số phiên
      # bản vẫn cài được. Nên bước này luôn nằm SAU bước test.
      - name: Đẩy lên nuget.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::warning::Chưa có secret NUGET_API_KEY — bỏ qua bước đẩy lên nuget.org."
            exit 0
          fi
          dotnet nuget push "nupkg/*.nupkg" \
            --source "https://api.nuget.org/v3/index.json" \
            --api-key "$NUGET_API_KEY" \
            --skip-duplicate

      - name: Tạo bản phát hành trên GitHub
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: nupkg/*.nupkg
