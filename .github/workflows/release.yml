name: Release

# Chỉ chạy khi đẩy một tag dạng v0.2.0.
# Phát hành gắn với TAG chứ không gắn với nhánh: mỗi phiên bản đã phát hành
# luôn trỏ về đúng một điểm cố định trong lịch sử, không bao giờ trôi.
on:
  push:
    tags: ['v*']

  # Cho phép chạy lại BẰNG TAY từ giao diện GitHub, không cần tạo tag mới.
  # Cần khi lần phát hành trước hỏng ở giữa chừng: gói đã lên feed rồi nhưng
  # bước sau đó đỏ. Không có nó thì cách duy nhất là dời tag — mà dời tag đã
  # phát hành ra ngoài là điều KHÔNG được làm khi đã có người dùng version đó.
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    # Token tạm mà GitHub cấp cho job này được làm đúng những gì khai ở đây, không hơn.
    permissions:
      # write chứ không phải read: GitHub xếp trang Release vào nhóm "contents", nên
      # tạo release là GHI vào repo. Khai read thì bước cuối trả 403
      # "Resource not accessible by integration".
      contents: write

      # Đẩy gói lên GitHub Packages.
      packages: write

    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Chặn sai sót kinh điển: tag v0.2.0 nhưng quên sửa <Version> trong
      # Directory.Build.props, thế là phát hành ra gói 0.1.0 mang tên 0.2.0.
      - name: Đối chiếu tag với số phiên bản trong mã nguồn
        if: github.ref_type == 'tag'
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          # Neo đầu dòng: nếu không, biểu thức này bắt trúng cả chữ <Version>
          # nằm trong phần chú thích ngay phía trên và so nhầm với một chuỗi vô nghĩa.
          FILE_VERSION=$(grep -oP '^\s*<Version>\K[^<]+' Directory.Build.props | head -1)
          echo "Tag: $TAG_VERSION | Directory.Build.props: $FILE_VERSION"
          if [ "$TAG_VERSION" != "$FILE_VERSION" ]; then
            echo "::error::Tag ($TAG_VERSION) không khớp <Version> trong Directory.Build.props ($FILE_VERSION)."
            exit 1
          fi

      - name: Build
        run: dotnet build -c Release

      # Không phát hành thứ chưa qua test. Đây là lý do bước này không được bỏ
      # cho nhanh, dù CI đã chạy trên commit đó rồi.
      - name: Test
        run: dotnet test --no-build -c Release

      - name: Đóng gói
        run: dotnet pack --no-build -c Release -o nupkg

      - name: Đẩy lên GitHub Packages
        run: |
          dotnet nuget push "nupkg/*.nupkg" \
            --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --api-key "${{ secrets.GITHUB_TOKEN }}" \
            --skip-duplicate

      # Đẩy tiếp lên nuget.org. Bỏ qua êm nếu chưa cấu hình secret, để việc phát
      # hành nội bộ không bị chặn chỉ vì chưa kịp tạo API key.
      #
      # ⚠️ Khác GitHub Packages ở một điểm KHÔNG thể sửa: phiên bản đã lên nuget.org
      # thì KHÔNG BAO GIỜ xoá được, chỉ ẩn khỏi tìm kiếm (unlist). Ai biết số phiên
      # bản vẫn cài được. Nên bước này luôn nằm SAU bước test.
      # ─────────────────────────────────────────────────────────────────────
      # TẠM TẮT — 2026-08-23. API key hiện tại bị nuget.org trả 403:
      #   "The specified API key is invalid, has expired, or does not have
      #    permission to access the specified package."
      #
      # Mở lại khi đã kiểm ba thứ (xem README, mục "Phát hành lên nuget.org"):
      #   1. Scope của key phải là "Push new packages and package versions",
      #      KHÔNG phải "Push only new package versions" — gói lần đầu lên thì
      #      loại thứ hai bị từ chối.
      #   2. Glob pattern phải phủ CẢ "Luong.Kernel" trơn lẫn "Luong.Kernel.*".
      #      Chỉ khai "Luong.Kernel.*" là không phủ gói gốc.
      #   3. Tài khoản nuget.org đã xác nhận email chưa — chưa xác nhận thì
      #      không đẩy được gói nào.
      #
      # Thử tay cho nhanh trước khi mở lại:
      #   dotnet nuget push nupkg/Luong.Kernel.0.1.0.nupkg \
      #     --source https://api.nuget.org/v3/index.json --api-key <KEY>
      # ─────────────────────────────────────────────────────────────────────
      # - name: Đẩy lên nuget.org
      #   env:
      #     NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
      #   run: |
      #     if [ -z "$NUGET_API_KEY" ]; then
      #       echo "::warning::Chưa có secret NUGET_API_KEY — bỏ qua bước đẩy lên nuget.org."
      #       exit 0
      #     fi
      #     dotnet nuget push "nupkg/*.nupkg" \
      #       --source "https://api.nuget.org/v3/index.json" \
      #       --api-key "$NUGET_API_KEY" \
      #       --skip-duplicate

      # Chỉ tạo Release khi chạy từ một tag. Bấm chạy tay thì không có tag để gắn
      # release vào, và action này sẽ đỏ.
      - name: Tạo bản phát hành trên GitHub
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: nupkg/*.nupkg
